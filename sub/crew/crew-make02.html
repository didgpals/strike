<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STRIKE</title>
    <!-- FONT -->
    <link rel="stylesheet" href="../../css/font.css" />

    <!-- CSS -->
    <link rel="stylesheet" href="../../css/reset.css" />
    <link rel="stylesheet" href="../../css/common.css" />
    <link rel="stylesheet" href="../../css/style2.css" />
  </head>
  <body>
    <div id="wrap">
      <header id="header" class="topbar topbar_sub">
        <a href="crew-make.html" class="btn_back">뒤로가기</a>
        <h1>크루개설</h1>
        <div class="util">
          <a href="#"></a>
        </div>
        <!--//util-->
      </header>
      <main id="main" class="crew_make02">
        <form class="join-form">
          <fieldset>
            <legend>지역 설정</legend>
            <input
              type="text"
              placeholder="크루를 진행할 동네를 설정해주세요."
              class="location"
            />
          </fieldset>
          <fieldset>
            <legend>크루 이름</legend>
            <input type="text" placeholder="모임 이름을 정해주세요." />
          </fieldset>
          <fieldset>
            <legend>크루 소개</legend>
            <textarea
              class="info"
              placeholder="모임 소개글을 적어주세요."
            ></textarea>
          </fieldset>
          <fieldset>
            <legend>정원</legend>
            <input type="text" placeholder="이메일을 입력해주세요." />
          </fieldset>
        </form>
      </main>
      <div id="dimmed">
        <div class="dimmed">
          <div class="pop-up">
            <div class="pop-up-top-txt">
              <h3>우리 동네 찾기</h3>
              <img
                src="../../img/common/icon_close.svg"
                alt="close"
                class="btn-close"
              />
            </div>
            <form class="pop-up-search">
              <fieldset>
                <input
                  type="text"
                  placeholder="우리 동네 이름(동,읍,면)으로 검색"
                  class="pop-up-search-mgt"
                />
                <div class="btn_area">
                  <a href="javascript:void(0)" class="active">
                    현재 위치로 찾기</a
                  >
                </div>
              </fieldset>
              <fieldset class="pop-up-search-result">
                <h4>주변동네</h4>
                <ul>
                  <li>부산 동래구 온천제1동</li>
                  <li>부산 동래구 온천동</li>
                  <li>부산 동래구 명륜동</li>
                  <li>부산 동래구 온천제2동</li>
                  <li>부산 동래구 온천제1동</li>
                  <li>부산 동래구 온천동</li>
                  <li>부산 동래구 명륜동</li>
                  <li>부산 동래구 온천제2동</li>
                  <li>부산 동래구 온천제1동</li>
                  <li>부산 동래구 온천동</li>
                  <li>부산 동래구 명륜동</li>
                  <li>부산 동래구 온천제2동</li>
                </ul>
              </fieldset>
            </form>
          </div>
        </div>
      </div>
      <div class="btn_area">
        <a href="join3.html" class="active"> 크루 만들기</a>
      </div>
    </div>
    <script src="../../js/jquery-3.7.1.min.js"></script>
    <script src="../../js/location.js"></script>
  </body>
</html>
